[package]
name = "spark-studio"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
readme.workspace = true
description = "Spark Studio：Unity-like 游戏编辑器（Widget dogfood）"
keywords = ["spark", "studio", "editor", "widget"]
categories = ["game-development", "gui"]
publish = false

[[bin]]
name = "spark-studio"
path = "src/main.rs"

[dependencies]
spark-core = { workspace = true }
spark-engine = { workspace = true }
spark-input = { workspace = true }
spark-renderer = { workspace = true }
spark-widget = { workspace = true }
ping-pong = { path = "../../examples/ping-pong" }
tetris = { path = "../../examples/tetris" }
snake = { path = "../../examples/snake" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
