[package]
name = "spark-studio"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
readme.workspace = true
description = "Spark Studio：Unity-like 游戏编辑器（Widget dogfood）"
keywords = ["spark", "studio", "editor", "widget"]
categories = ["game-development", "gui"]
publish = false

[lib]
name = "spark_studio"
path = "src/lib.rs"

[[bin]]
name = "spark-studio"
path = "src/main.rs"

[dependencies]
spark-types = { workspace = true }
spark-engine = { workspace = true }
spark-input = { workspace = true }
spark-renderer = { workspace = true }
spark-widget = { workspace = true }
ping-pong = { workspace = true }
tetris = { workspace = true }
snake = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
