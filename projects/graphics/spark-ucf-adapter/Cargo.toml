[package]
name = "spark-ucf-adapter"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
readme.workspace = true
description = "可选 UCF 计算/后处理适配：不进入 ECS 或窗口泵"
keywords = ["spark", "ucf", "compute"]
categories = ["game-development"]
publish = false

[features]
default = ["cpu"]
cpu = ["dep:ucf"]
wgpu = ["cpu", "dep:wgpu"]
renderer = ["cpu", "dep:spark-renderer"]

[dependencies]
ucf = { git = "https://github.com/muse-gpt/ucf.rs.git", branch = "dev", default-features = false, features = ["cpu"], optional = true }
wgpu = { workspace = true, optional = true }
spark-renderer = { workspace = true, optional = true }

[dev-dependencies]
ucf = { git = "https://github.com/muse-gpt/ucf.rs.git", branch = "dev", default-features = false, features = ["cpu"] }
wgpu = { workspace = true }
pollster = { workspace = true }
spark-renderer = { workspace = true }
spark-types = { workspace = true }
