[workspace]
resolver = "2"
members = [
    "projects/foundation/*",
    "projects/formats/*",
    "projects/graphics/*",
    "projects/scripting/*",
    "projects/gameplay/*",
    "projects/bindings/*",
    "projects/examples/ping-pong",
    "projects/examples/tetris",
    "projects/examples/snake",
]
default-members = [
    "projects/bindings/spark-wasm",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
authors = ["Aster <192607617@qq.com>"]
license = "Apache-2.0"
readme = "readme.md"

[workspace.dependencies]
spark-core = { path = "projects/foundation/spark-core" }
spark-diagnostics = { path = "projects/foundation/spark-diagnostics" }
spark-logger = { path = "projects/foundation/spark-logger" }
spark-geometry = { path = "projects/foundation/spark-geometry" }
spark-ecs = { path = "projects/foundation/spark-ecs" }
spark-time = { path = "projects/foundation/spark-time" }
spark-event = { path = "projects/foundation/spark-event" }
spark-input = { path = "projects/foundation/spark-input" }
spark-physics = { path = "projects/foundation/spark-physics" }
spark-circuit = { path = "projects/foundation/spark-circuit" }
spark-net = { path = "projects/foundation/spark-net" }
spark-asset = { path = "projects/foundation/spark-asset" }
spark-localization = { path = "projects/foundation/spark-localization" }
spark-debugger = { path = "projects/foundation/spark-debugger" }
spark-shader = { path = "projects/graphics/spark-shader" }
spark-font = { path = "projects/graphics/spark-font" }
spark-texture = { path = "projects/graphics/spark-texture" }
spark-image = { path = "projects/foundation/spark-image" }
spark-image-formats = { path = "projects/formats/spark-image-formats" }
spark-renderer = { path = "projects/graphics/spark-renderer" }
spark-renderer-wgpu = { path = "projects/graphics/spark-renderer-wgpu" }
spark-widget = { path = "projects/graphics/spark-widget" }
spark-animator = { path = "projects/foundation/spark-animator" }
spark-gltf = { path = "projects/formats/spark-gltf" }
spark-media = { path = "projects/foundation/spark-media" }
spark-audio = { path = "projects/foundation/spark-audio" }
spark-video = { path = "projects/foundation/spark-video" }
spark-gc = { path = "projects/scripting/spark-gc" }
spark-vm = { path = "projects/scripting/spark-vm" }
spark-jit = { path = "projects/scripting/spark-jit" }
spark-ir = { path = "projects/scripting/spark-ir" }
spark-script = { path = "projects/scripting/spark-script" }
spark-script-valkyrie = { path = "projects/scripting/spark-script-valkyrie" }
spark-script-lua = { path = "projects/scripting/spark-script-lua" }
spark-script-ruby = { path = "projects/scripting/spark-script-ruby" }
spark-plugin = { path = "projects/gameplay/spark-plugin" }
spark-plugin-live2d = { path = "projects/gameplay/spark-plugin-live2d" }
spark-plugin-steam = { path = "projects/gameplay/spark-plugin-steam" }
spark-engine = { path = "projects/gameplay/spark-engine" }
spark-engine-rts = { path = "projects/gameplay/spark-engine-rts" }
spark-engine-stg = { path = "projects/gameplay/spark-engine-stg" }
spark-engine-rpg = { path = "projects/gameplay/spark-engine-rpg" }
spark-engine-platformer = { path = "projects/gameplay/spark-engine-platformer" }
spark-engine-galgame = { path = "projects/gameplay/spark-engine-galgame" }
spark-napi = { path = "projects/bindings/spark-napi" }
spark-wasm = { path = "projects/bindings/spark-wasm" }
oak-core = { git = "https://github.com/ygg-lang/oaks.git", branch = "dev" }
oak-valkyrie = { git = "https://github.com/ygg-lang/oaks.git", branch = "dev" }
oak-lua = { git = "https://github.com/ygg-lang/oaks.git", branch = "dev" }
oak-ruby = { git = "https://github.com/ygg-lang/oaks.git", branch = "dev" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wgpu = { version = "30.0.1", default-features = true }
winit = "0.30"
pollster = "1"
bytemuck = { version = "1", features = ["derive"] }
fontdue = "0.9"
image = { version = "0.25", default-features = true }
symphonia = { version = "0.6.1", features = [
    "aac",
    "adpcm",
    "alac",
    "flac",
    "isomp4",
    "mkv",
    "mp3",
    "ogg",
    "pcm",
    "vorbis",
    "wav",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rodio = { version = "0.22", default-features = true }
gltf = { version = "1.4", default-features = true }
base64 = "0.23"
napi = { version = "3", default-features = false, features = ["napi4"] }
napi-derive = "3"
ping-pong = { path = "projects/examples/ping-pong" }
tetris = { path = "projects/examples/tetris" }
snake = { path = "projects/examples/snake" }

[profile.release]
opt-level = 3
codegen-units = 1
lto = true
