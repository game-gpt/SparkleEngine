[workspace]
resolver = "2"
members = [
    "projects/foundation/*",
    "projects/graphics/*",
    "projects/scripting/*",
    "projects/gameplay/*",
    "projects/bindings/*",
]
default-members = [
    "projects/bindings/spark-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Aster <192607617@qq.com>"]
license = "Apache-2.0"
readme = "readme.md"

[workspace.dependencies]
spark-core = { path = "projects/foundation/spark-core" }
spark-geometry = { path = "projects/foundation/spark-geometry" }
spark-ecs = { path = "projects/foundation/spark-ecs" }
spark-time = { path = "projects/foundation/spark-time" }
spark-event = { path = "projects/foundation/spark-event" }
spark-input = { path = "projects/foundation/spark-input" }
spark-shader = { path = "projects/graphics/spark-shader" }
spark-font = { path = "projects/graphics/spark-font" }
spark-image = { path = "projects/graphics/spark-image" }
spark-renderer = { path = "projects/graphics/spark-renderer" }
spark-renderer-wgpu = { path = "projects/graphics/spark-renderer-wgpu" }
spark-widget = { path = "projects/graphics/spark-widget" }
spark-media = { path = "projects/graphics/spark-media" }
spark-audio = { path = "projects/graphics/spark-audio" }
spark-video = { path = "projects/graphics/spark-video" }
spark-gc = { path = "projects/scripting/spark-gc" }
spark-vm = { path = "projects/scripting/spark-vm" }
spark-jit = { path = "projects/scripting/spark-jit" }
spark-script = { path = "projects/scripting/spark-script" }
spark-script-valkyrie = { path = "projects/scripting/spark-script-valkyrie" }
spark-script-lua = { path = "projects/scripting/spark-script-lua" }
spark-script-ruby = { path = "projects/scripting/spark-script-ruby" }
spark-plugin = { path = "projects/gameplay/spark-plugin" }
spark-plugin-live2d = { path = "projects/gameplay/spark-plugin-live2d" }
spark-plugin-steam = { path = "projects/gameplay/spark-plugin-steam" }
spark-engine = { path = "projects/gameplay/spark-engine" }
spark-engine-rts = { path = "projects/gameplay/spark-engine-rts" }
spark-engine-stg = { path = "projects/gameplay/spark-engine-stg" }
spark-engine-rpg = { path = "projects/gameplay/spark-engine-rpg" }
spark-engine-platformer = { path = "projects/gameplay/spark-engine-platformer" }
spark-engine-galgame = { path = "projects/gameplay/spark-engine-galgame" }
spark-app = { path = "projects/bindings/spark-app" }
oak-core = { git = "https://github.com/ygg-lang/oaks.git", branch = "dev" }
oak-valkyrie = { git = "https://github.com/ygg-lang/oaks.git", branch = "dev" }
oak-lua = { git = "https://github.com/ygg-lang/oaks.git", branch = "dev" }
oak-ruby = { git = "https://github.com/ygg-lang/oaks.git", branch = "dev" }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wgpu = { version = "30.0.1", default-features = true }
winit = "0.30"
pollster = "1"
bytemuck = { version = "1", features = ["derive"] }
fontdue = "0.9"
image = { version = "0.25", default-features = true }
symphonia = { version = "0.5.5", features = [
    "aac",
    "adpcm",
    "alac",
    "flac",
    "isomp4",
    "mkv",
    "mp3",
    "ogg",
    "pcm",
    "vorbis",
    "wav",
] }

[profile.release]
opt-level = 3
codegen-units = 1
lto = true
