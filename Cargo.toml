[workspace]
resolver = "2"
members = [
    "projects/engine/*",
    "projects/bindings/*",
]
default-members = [
    "projects/bindings/spark-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Aster <192607617@qq.com>"]
license = "Apache-2.0"
readme = "readme.md"

[workspace.dependencies]
spark-core = { path = "projects/engine/spark-core" }
spark-ecs = { path = "projects/engine/spark-ecs" }
spark-time = { path = "projects/engine/spark-time" }
spark-event = { path = "projects/engine/spark-event" }
spark-input = { path = "projects/engine/spark-input" }
spark-app = { path = "projects/bindings/spark-app" }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
winit = "0.30"

[profile.release]
opt-level = 3
codegen-units = 1
lto = true
